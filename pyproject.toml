[project]
name = "observe"
version = "0.1.0"
description = "Local telemetry for coding agents (Claude Code, Codex): hooks -> SQLite -> session timeline and graph."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
observe = "observe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/observe"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
